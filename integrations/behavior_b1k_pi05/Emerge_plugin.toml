[plugin]
name = "behavior-b1k-pi05"
version = "0.4.0"

[driver]
name = "behavior_b1k_pi05"
module = "integrations.behavior_b1k_pi05.driver"
class = "BehaviorB1KPi05Driver"
profile_path = "profile_behavior_r1pro.md"

[python]
# ``sys_paths`` must stay inside the plugin directory: ``register_plugin``
# stores these entries relative to the plugin root.  The dotted module path is
# what keeps this driver unique, and it resolves because the controller is
# started as ``python -m robot.controller`` from the repository root.
sys_paths = ["."]
