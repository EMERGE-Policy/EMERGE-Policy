[project]
name = "Emerge-Policy"
version = "0.1.4.post4"
description = "A lightweight personal AI assistant framework"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Emerge-Policy contributors"}
]
keywords = ["ai", "agent", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.20.0,<1.0.0",
    "litellm>=1.82.1,<2.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "websockets>=16.0,<17.0",
    "websocket-client>=1.9.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "readability-lxml>=0.8.4,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "dingtalk-stream>=0.24.0,<1.0.0",
    "python-telegram-bot[socks]>=22.6,<23.0",
    "lark-oapi>=1.5.0,<2.0.0",
    "socksio>=1.0.0,<2.0.0",
    "python-socketio>=5.16.0,<6.0.0",
    "msgpack>=1.1.0,<2.0.0",
    "numpy>=1.26.0,<2.0.0",
    "torch==2.3.1",
    "torchvision==0.18.1",
    "triton==2.3.1; platform_system == 'Linux' and platform_machine == 'x86_64'",
    "setuptools>=61,<82",
    "pycocotools==2.0.11",
    "psutil==7.2.2",
    "Pillow>=10.0.0,<13.0.0",
    "slack-sdk>=3.39.0,<4.0.0",
    "slackify-markdown>=0.2.0,<1.0.0",
    "qq-botpy>=1.2.0,<2.0.0",
    "python-socks[asyncio]>=2.8.0,<3.0.0",
    "prompt-toolkit>=3.0.50,<4.0.0",
    "pyzmq>=27.1.0,<28.0.0",
    "json-repair>=0.57.0,<1.0.0",
    "chardet>=3.0.2,<6.0.0",
    "openai>=2.8.0",
    "tiktoken>=0.12.0,<1.0.0",
    "oauth-cli-kit>=0.1.3,<1.0.0",
]

[project.optional-dependencies]
libero = [
    "robosuite==1.5.2",
    "mujoco==3.9.0",
    "open3d==0.19.0",
    "hydra-core==1.2.0",
    "bddl==1.0.1",
    "easydict==1.9",
    "gym==0.25.2",
    "future==1.0.0",
    "Wand==0.7.2",
    "scikit-image==0.22.0",
]
wecom = [
    "wecom-aibot-sdk-python>=0.1.2",
]
matrix = [
    "matrix-nio[e2e]>=0.25.2",
    "mistune>=3.0.0,<4.0.0",
    "nh3>=0.2.17,<1.0.0",
]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "ruff>=0.1.0",
    "matrix-nio[e2e]>=0.25.2",
    "mistune>=3.0.0,<4.0.0",
    "nh3>=0.2.17,<1.0.0",
]

[project.scripts]
emerge = "Emerge.cli.commands:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["Emerge", "robot", "external_model_server"]

[tool.hatch.build.targets.wheel.sources]
"Emerge" = "Emerge"

# Include non-Python files in skills and templates
[tool.hatch.build]
include = [
    "Emerge/**/*.py",
    "Emerge/templates/**/*.md",
    "Emerge/skills/**/*.md",
    "Emerge/skills/**/*.sh",
    "Emerge/subagents/**/skills/**/*.md",
    "robot/**/*.py",
    "external_model_server/**/*.py",
    "robot/profiles/**/*.md",
]

[tool.hatch.build.targets.sdist]
include = [
    "Emerge/",
    "robot/",
    "external_model_server/",
    "bridge/",
    "README.md",
    "LICENSE",
]


[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]
